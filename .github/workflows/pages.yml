name: Publish mobile dashboard

on:
  push:
    branches: [main]
    paths:
      - "mobile_dashboard/site/index.html"
      - "mobile_dashboard_v2/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble v1 and isolated v2 sites
        run: |
          mkdir -p _site/v2 _site/data
          cp -R mobile_dashboard/site/. _site/
          cp -R mobile_dashboard_v2/site/. _site/v2/
          cp mobile_dashboard_v2/data/data.json _site/data/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow Pages artifact registration to finish
        run: sleep 10
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
