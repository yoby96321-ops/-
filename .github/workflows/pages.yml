name: Publish mobile dashboard

on:
  push:
    branches: [main]
    paths:
      - "mobile_dashboard/site/index.html"\n      - "mobile_dashboard_v2/**"\n      - ".github/workflows/update_00403a_v2.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile_dashboard/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

