name: Update 00403A v2 data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile_dashboard_v2/update_model.py"
  schedule:
    - cron: '20 6 * * 1-5'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy
      - run: python mobile_dashboard_v2/update_model.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update 00403A v2 daily model data'
      - uses: actions/configure-pages@v5
      - name: Assemble sites with refreshed data
        run: |
          mkdir -p _site/v2 _site/data
          cp -R mobile_dashboard/site/. _site/
          cp -R mobile_dashboard_v2/site/. _site/v2/
          cp mobile_dashboard_v2/data/data.json _site/data/data.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Allow Pages artifact registration to finish
        run: sleep 10
      - name: Deploy pages
        id: deployment
        uses: actions/deploy-pages@v4
